# project.yml — the SpektraLab iOS target, generated by XcodeGen.
#
#   xcodegen generate          # → SpektraLab-iOS.xcodeproj
#
# The composition mirrors the macOS target (Tools/gen-project.py):
#
#   * the C++ render engine compiles **into** the app target, not a separate
#     library — the same one-target decision the Mac made (RFC-014). Only
#     src/core, src/gpu and src/pipeline join; `vulkan_gpu.cpp` compiles to
#     nothing under `#ifndef __APPLE__`, and src/desktop is the Mac's preview
#     host and stays out.
#   * the engine's Metal kernels are **not** compiled by Xcode: the metallib
#     ships prebuilt from `ios/build.sh`, which sets the safe-math flags the
#     engine's `spk_math_probe` guard demands. MTL_FAST_MATH=YES is for the
#     canvas's own Shaders.metal only, exactly as on the Mac.
#   * excluded sources are the macOS-only surfaces: the AppKit windows, the
#     agent CLI/MCP, the update check, the export page, the macOS filmstrip
#     and the macOS @main. Their iOS counterparts live in `app/`.
#
# The shared Swift (Model, Service, Canvas, Controls, Panels minus the
# filmstrip, Import minus NSOpenPanel, Export minus the export page, Theme,
# Diagnostics, Localization) is included unmodified apart from the `#if
# os(macOS)` blocks the port added — one source of truth for both platforms.

name: SpektraLab-iOS
options:
  bundleIdPrefix: com.spektralab
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_CXX_LIBRARY: libc++
    SWIFT_OBJC_BRIDGING_HEADER: ../modern_UI/Spektrafilm/Spektrafilm/Service/Spektrafilm-Bridging-Header.h
    HEADER_SEARCH_PATHS: "$(SRCROOT)/../engine/include $(SRCROOT)/../engine/src $(SRCROOT)/../engine/src/core $(SRCROOT)/../engine/third_party/metal-cpp"
    # The engine's extern "C" API returns Params/Json by value. That is the
    # Itanium ABI on the Mac and compiles silently; iOS arm64 flags it as a
    # C-linkage return of a user-defined type. One platform consumes these
    # functions, so the ABI concern does not apply — silence the warning.
    OTHER_CFLAGS: -Wno-return-type-c-linkage
    MTL_FAST_MATH: YES            # canvas shader only; the engine metallib is prebuilt safe
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SpektraLab-iOS:
    type: application
    platform: iOS
    sources:
      # — the app's shared Swift, minus the macOS-only surfaces —
      - path: ../modern_UI/Spektrafilm/Spektrafilm
        excludes:
          - "Windows/**"
          - "Agent/**"
          - "Updates/**"
          - "Export/ExportPage.swift"
          - "Panels/Filmstrip.swift"
          - "SpektrafilmApp.swift"
          - "Info.plist"
          - "Spektrafilm.entitlements"
      # — the iOS app: @main, editor layout, canvas, import, export —
      - path: app
      # — the engine, compiled into the target as on the Mac —
      - path: ../engine/src/core
      - path: ../engine/src/gpu
      - path: ../engine/src/pipeline
      # — resources: ONE folder reference. build.sh merges the app's own
      #   resources (DI, FilmCovers, Licenses, StockCatalog.json) with the
      #   staged engine data (constants, profiles, print LUTs and the
      #   **iOS-built** metallib — never the macOS one) into ios/Resources;
      #   two folder references would both copy as "Resources" and collide. —
      - path: Resources
        type: folder
        buildPhase: resources
      - path: ../modern_UI/Spektrafilm/Spektrafilm/SpektraLab.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spektralab.ios
        PRODUCT_NAME: SpektraLab
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: SpektraLab
        SUPPORTS_MACCATALYST: NO
    dependencies:
      # The engine's overscan node convolves with vImage; the Mac target
      # links Accelerate the same way.
      - sdk: Accelerate.framework
    info:
      path: app/Info.plist
      properties:        CFBundleDisplayName: SpektraLab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription:
          SpektraLab saves the prints you export into your photo library.
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
              - public.camera-raw-image
